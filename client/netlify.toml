# ==========================================
# NETLIFY CONFIGURATION FOR NEXUSMAIL CLIENT
# ==========================================

[build]
  publish = "dist"
  command = "npm run build"

# Proxy /api calls to your production backend server (Render / Railway / etc.)
# Replace destination URL with your actual deployed backend URL
[[redirects]]
  from = "/api/*"
  to = "https://nexusmail-intelligent-email-assistant.onrender.com"
  status = 200
  force = true

# Single Page Application (SPA) fallback routing for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
